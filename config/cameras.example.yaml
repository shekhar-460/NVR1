# Copy to config/cameras.yaml and edit. Requires ffmpeg on PATH.
# Paths below are relative to this file's directory (config/).

# Project root: ../ is the NVR repo root (this file lives in config/).
recordings_dir: ../recordings
hls_dir: ../data/hls
# mpegts = .ts segments (works well with H.264/H.265 copy). Use mp4 for H.264 if you prefer.
recording_format: mpegts
segment_seconds: 300
rtsp_transport: tcp

# Global toggles — per-camera values (below) override these when set.
# CLI flags (--record/--no-record, --web/--no-web) override both.
record: true
live: true

# Live HLS tuning (lower = less latency, higher = more stability).
live_hls:
  segment_seconds: 1.0
  list_size: 6
  delete_threshold: 1
  playlist_fresh_seconds: 8.0
  target_latency_seconds: 3.0

web:
  host: "0.0.0.0"
  port: 8765

# Credentials: set NVR_RTSP_USERNAME and NVR_CAM_*_PASSWORD in a .env file at the repo root
# (loaded automatically). Use ${VAR_NAME} in rtsp URLs as shown below.

cameras:
  - id: front_door
    name: Front door
    url: rtsp://${NVR_RTSP_USERNAME}:${NVR_CAM_FRONT_DOOR_PASSWORD}@192.168.1.100:554/stream1
    # hevc_tag: true # uncomment for H.265 main streams (Hikvision/Reolink etc.)
    # record: false  # live-only for this camera
    # live: false    # archive-only for this camera
    # enabled: false # disables both record and live for this camera
  - id: garage
    name: Garage
    url: rtsp://${NVR_RTSP_USERNAME}:${NVR_CAM_GARAGE_PASSWORD}@192.168.1.101:554/h264Preview_01_main
